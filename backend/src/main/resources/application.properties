# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (Supabase)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer datasource initialization so Hibernate can create tables before data.sql runs
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME}
spring.mail.password=${GMAIL_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
storyline.cors.allowed-origins=${STORYLINE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://storyline-design-and-events.vercel.app}

# Admin Config
storyline.admin.email=${ADMIN_EMAIL}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
